name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.repository == 'ContextNine/ctx9' && github.ref == 'refs/heads/master'
        with:
          cosign-release: v3.1.3
      - name: Accept isolated archive installation and real Sigstore trust
        if: github.repository == 'ContextNine/ctx9' && github.ref == 'refs/heads/master'
        run: python scripts/accept_hosted_release.py --archive dist/ctx9-0.4.1.tar.gz --cosign "$(command -v cosign)" --output dist/acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.repository == 'ContextNine/ctx9' && github.ref == 'refs/heads/master'
        with:
          name: ctx9-acceptance-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 30
